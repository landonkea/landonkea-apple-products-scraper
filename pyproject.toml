# ───────────────────────────────────────────────────────────────────
# Project metadata and dependencies
# ───────────────────────────────────────────────────────────────────
# This file tells Python what libraries this project needs and how
# to run it.  Think of it like a recipe — it lists all ingredients
# (dependencies) and instructions (scripts).
# ───────────────────────────────────────────────────────────────────

[build-system]
# We use "setuptools" as the build tool, which is the standard
# Python packaging system.
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
# ── Basic info ─────────────────────────────────────────────────────
name = "landonkea-apple-products-scraper"
version = "1.0.0"
description = "Scrapes eBay, Swappa, Apple Refurb, Back Market, Mercari and more every 6 hours, alerting on great deals for MacBook Pro (last 3 chip generations) and iPhone Pro Max (last 3 generations)."
readme = "README.md"
requires-python = ">=3.11"

# ── Dependencies ───────────────────────────────────────────────────
# These are the libraries this project uses.
# They get installed automatically when you run `pip install -e .`
dependencies = [
    # ── Web scraping ──────────────────────────────────────────────
    "requests>=2.31",          # Fetches web pages (HTTP library)
    "beautifulsoup4>=4.12",    # Parses HTML (finds elements by CSS class, etc.)
    "lxml>=5.0",              # Fast HTML/XML parser (BeautifulSoup backend)

    # ── Database ──────────────────────────────────────────────────
    "sqlalchemy>=2.0",         # Database ORM (lets us use SQLite or Postgres)
    # NOTE: no Alembic here on purpose. Schema changes (e.g. adding
    # cpu_cores/gpu_cores) are handled by a small ALTER-TABLE helper
    # in src/database.py (_ensure_columns) instead — see that
    # function's docstring for why. Alembic used to be listed as a
    # dependency despite never being used anywhere in this project.

    # ── Configuration ─────────────────────────────────────────────
    "pyyaml>=6.0",             # Reads config.yaml files

    # ── Browser automation (for JS-heavy sites like OfferUp) ────
    # Playwright launches a headless Chromium to render JavaScript
    # pages.  No paid service needed — runs on GitHub Actions free.
    # To install browsers: playwright install chromium
    "playwright>=1.40",

    # ── Anti-detection for Playwright (bypasses Cloudflare) ────
    "playwright-stealth>=1.0",
]

# ── Command-line entry point ───────────────────────────────────────
# This defines the `apple-product-scraper` command.
# When you run `apple-product-scraper`, Python calls main() from src/main.py.
[project.scripts]
apple-product-scraper = "main:main"

# ── Development dependencies ──────────────────────────────────────
# These are only needed when DEVELOPING the project (not running it).
[project.optional-dependencies]
dev = [
    "pytest>=8.0",             # Test framework
    "pytest-cov>=4.0",         # Test coverage reporting
    "ruff>=0.3",               # Code linter
    "mypy>=1.8",               # Type checker
]

# ── Linter config ────────────────────────────────────────────────
# WHY THIS IS SCOPED (not ruff's full default rule set): ruff with
# no config applies a large, opinionated default selection (style
# preferences like "combine these two if-statements", "don't catch
# a blind Exception", "use the datetime.UTC alias") that this project
# has never followed and that mostly aren't real bugs. Selecting just
# "E" (pycodestyle) and "F" (pyflakes) keeps ruff focused on things
# that are almost always real problems — unused imports/variables,
# undefined names, syntax issues — without a wall of stylistic noise
# on every run. Run `ruff check .` from the repo root.
[tool.ruff]
line-length = 120  # This codebase's comments/docstrings run long on purpose

[tool.ruff.lint]
select = ["E", "F"]

# ── Type checker config ─────────────────────────────────────────────
# `explicit_package_bases` + `mypy_path` tell mypy where this
# project's own modules live (src/), so it can actually analyze them
# instead of reporting every internal import as "missing library
# stubs" (which is what happens by default, since src/ isn't a
# normal installed package layout). Run `mypy src/` from the repo
# root.
[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true  # Third-party libs (bs4, playwright, etc.) don't ship types
