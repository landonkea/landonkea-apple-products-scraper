# ───────────────────────────────────────────────────────────────────
# CONFIGURATION FILE — landonkea-apple-products-scraper
# ───────────────────────────────────────────────────────────────────
# This is the ONLY file you need to edit to change what you're
# searching for.  Every setting here is read at runtime.
#
# To search for a different product next year, just change the
# values below.  No code changes needed.
# ───────────────────────────────────────────────────────────────────

# ── PRODUCT GENERATIONS ─────────────────────────────────────────────
# This is the ONE place you touch when Apple ships something new.
# Each family below defines "the current generation" and how many
# generations back to also search.  Searches that reference a family
# via `generation_family:` automatically get a rolling window —
# e.g. current_gen: 5, lookback: 3 on mac_chip means "search M5 Max,
# M4 Max, and M3 Max."  Bump current_gen once a year; nothing else
# needs to change.
generations:
  mac_chip:
    tier: "Max"          # flagship tier suffix — MacBook Pro's best chip bin
    current_gen: 5         # bump to 6 when Apple ships M6
    lookback: 3              # search current_gen, current_gen-1, current_gen-2
    # Flagship CPU/GPU core counts per generation. Best-effort and
    # used only to give a small scoring bonus to listings that state
    # the top-bin core count for their chip — never a hard filter,
    # since most listings don't mention core counts at all. Update
    # these once you confirm the real spec-sheet numbers for a new gen.
    core_counts:
      5: {cpu: 18, gpu: 40}
      4: {cpu: 16, gpu: 40}
      3: {cpu: 16, gpu: 40}

  iphone_pro_max:
    tier: "Pro Max"
    current_gen: 17        # bump when Apple ships the next iPhone
    lookback: 3              # search 17/16/15 Pro Max

# ── WHAT TO SEARCH FOR ─────────────────────────────────────────────
# List of products to search for.  The scraper runs once per product
# and alerts you about the best deals on each one.
# Add a new entry to search for a different product.
searches:
  # ── MacBook Pro (14" preferred, 16" fallback; last 3 Max chip
  # generations via mac_chip above) ────────────────────────────
  - product_name: "MacBook Pro"
    generation_family: mac_chip
    screen_sizes: [14, 16]   # order = preference: 14" preferred, 16" fallback
    ram_gb_primary: 128
    ram_gb_fallback: 64
    storage_gb_min: 1024    # 1TB minimum; no max — 1/2/4/6/8TB all valid,
    storage_gb_max: ~        # bigger just scores a little higher (see price_analyzer.py)
    location: ~
    results_per_size: 30

  # ── iPhone Pro Max (1TB+; last 3 generations via iphone_pro_max
  # above — currently 17/16/15 Pro Max) ─────────────────────────
  - product_name: "iPhone Pro Max"
    generation_family: iphone_pro_max
    screen_sizes: []
    ram_gb_primary: ~
    ram_gb_fallback: ~
    storage_gb_min: 1000  # 1TB minimum (also covers 2TB)
    storage_gb_max: ~
    location: ~
    results_per_size: 30

# ── PRICE THRESHOLDS ───────────────────────────────────────────────
# These determine what counts as a "deal worth alerting about".
# The scraper will compare every listing against these numbers.
price:
  # Absolute maximum price we're willing to pay.
  # Anything above this is ignored entirely.
  absolute_max_usd: 8000

  # "Great deal" threshold — alert immediately if below this.
  # Based on research: 128GB models retail ~$6,200-9,700 new.
  # A great deal on 128GB would be under $5,000 (~25%+ off retail).
  # For 64GB, under $4,000.
  great_deal_usd:
    128: 5000    # 128GB: alert if under $5,000
    64:  4000    # 64GB:  alert if under $4,000

  # "Good deal" threshold — worth checking but less urgent.
  good_deal_usd:
    128: 5500    # 128GB: worth looking at under $5,500
    64:  4500    # 64GB:  worth looking at under $4,500

  # Number of top deals to include in each alert email
  # Increased from 15 to 25 to account for more scraping sources
  # (Best Buy, OfferUp, and future Facebook + Amazon).
  top_deals_count: 40

# ── WHAT SITES TO SCRAPE ───────────────────────────────────────────
# Set a site to "enabled: false" to skip it without deleting it.
# Each site has its own scraper module.
sites:
  ebay:
    enabled: true
    # eBay search URL template.  {{query}} is replaced with the
    # search term, {{min_ram}} with the minimum RAM.
    # We search for "MacBook Pro M5 Max 128GB" etc.
    search_url: "https://www.ebay.com/sch/i.html?_nkw={{query}}&_sop=15&LH_BIN=1&_udhi={{max_price}}"

  swappa:
    enabled: true
    # Swappa has a dedicated API for listings.
    base_url: "https://swappa.com/api"

  apple_refurb:
    enabled: true
    # Apple's Certified Refurbished store. NOTE: this search_url is
    # not actually used — src/scrapers/apple_refurb.py hits Apple's
    # evergreen "14-inch-macbook-pro" / "16-inch-macbook-pro" refurb
    # pages directly (those URLs aren't year- or chip-specific, so
    # they never need updating). Kept here only for reference.
    search_url: "https://www.apple.com/shop/refurbished/mac"

  backmarket:
    enabled: true
    search_url: "https://www.backmarket.com/search?q={{query}}"

  mercari:
    enabled: true
    search_url: "https://www.mercari.com/search/?keyword={{query}}"

  bestbuy:
    enabled: true
    # Best Buy Open Box — returned/inspected items at a discount.
    # The scraper uses the "af=condition%3Aopen+box" URL filter
    # and also validates condition text in each listing card.
    search_url: "https://www.bestbuy.com/site/searchpage.jsp?st={{query}}&af=condition%3Aopen+box"

  offerup:
    enabled: true
    # NOTE: OfferUp is fully JavaScript-rendered.  The scraper
    # tries JSON-LD, Next.js data, and the internal API.  If
    # none work, it logs instructions for Playwright setup.
    search_url: "https://offerup.com/search/?q={{query}}"

  gazelle:
    enabled: true
    # Gazelle's actual storefront lives on buy.gazelle.com (a Shopify
    # store) — www.gazelle.com 404s on collection/product/search
    # routes. The scraper hits buy.gazelle.com's public Shopify JSON
    # endpoints directly: /collections/{handle}/products.json for
    # known per-generation collections (e.g. iphone-17-pro-max), and
    # /search/suggest.json as a site-wide fallback. Gazelle does not
    # currently stock MacBooks (confirmed live — see gazelle.py's
    # module docstring), so the MacBook Pro search legitimately finds
    # 0 listings here today.
    search_url: "https://buy.gazelle.com/search/suggest.json?q={{query}}&resources[type]=product"

  # Facebook Marketplace requires a login — we handle this via
  # environment variables for the session cookie.
  facebook:
    enabled: false          # Disabled by default — requires login setup
    search_url: "https://www.facebook.com/marketplace/search/?query={{query}}"

# ── ALERT SETTINGS ─────────────────────────────────────────────────
# How you want to be notified when a deal is found.
alerts:
  # Email via Gmail SMTP (free).  Set these in GitHub Secrets:
  #   ALERT_EMAIL_FROM, ALERT_EMAIL_TO, GMAIL_APP_PASSWORD
  email:
    enabled: true
    smtp_server: "smtp.gmail.com"
    smtp_port: 587

  # Discord webhook (free).  Create a webhook in your Discord
  # server's channel settings, then set DISCORD_WEBHOOK_URL
  # in GitHub Secrets.
  discord:
    enabled: true

# ── RUN SCHEDULE ───────────────────────────────────────────────────
# How often to run the scraper.
# This is a cron expression.  "0 */6 * * *" = every 6 hours.
schedule:
  cron: "0 */6 * * *"

# ── DATABASE ───────────────────────────────────────────────────────
database:
  # SQLite is the default — no server needed, file-based.
  # Change to postgresql://user:pass@host/db if you want Postgres.
  url: "sqlite:///data/listings.db"
