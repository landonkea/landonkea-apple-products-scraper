# ───────────────────────────────────────────────────────────────────
# CONFIGURATION FILE — landonkea-apple-products-scraper
# ───────────────────────────────────────────────────────────────────
# This is the ONLY file you need to edit to change what you're
# searching for.  Every setting here is read at runtime.
#
# To search for a different product next year, just change the
# values below.  No code changes needed.
# ───────────────────────────────────────────────────────────────────

# ── PRODUCT GENERATIONS ─────────────────────────────────────────────
# This is the ONE place you touch when Apple ships something new.
# Each family below defines "the current generation" and how many
# generations back to also search.  Searches that reference a family
# via `generation_family:` automatically get a rolling window —
# e.g. current_gen: 5, lookback: 3 on mac_chip means "search M5 Max,
# M4 Max, and M3 Max."  Bump current_gen once a year; nothing else
# needs to change.
generations:
  mac_chip:
    tier: "Max"          # flagship tier suffix — MacBook Pro's best chip bin
    current_gen: 5         # bump to 6 when Apple ships M6
    lookback: 3              # search current_gen, current_gen-1, current_gen-2
    # Flagship CPU/GPU core counts per generation. Best-effort and
    # used only to give a small scoring bonus to listings that state
    # the top-bin core count for their chip — never a hard filter,
    # since most listings don't mention core counts at all. Update
    # these once you confirm the real spec-sheet numbers for a new gen.
    core_counts:
      5: {cpu: 18, gpu: 40}
      4: {cpu: 16, gpu: 40}
      3: {cpu: 16, gpu: 40}

  iphone_pro_max:
    tier: "Pro Max"
    current_gen: 17        # bump when Apple ships the next iPhone
    lookback: 3              # search 17/16/15 Pro Max

# ── WHAT TO SEARCH FOR ─────────────────────────────────────────────
# List of products to search for.  The scraper runs once per product
# and alerts you about the best deals on each one.
# Add a new entry to search for a different product.
# ── PRODUCT TYPES ────────────────────────────────────────────────────
# `product_type` on a search entry below picks which handler (in
# src/product_types/) owns matching/scoring for that search. Defaults
# to "electronics" if omitted — that's the only type that exists
# today (MacBook Pro / iPhone). To search a whole new category later
# (the user's own example: dress boots), see src/product_types/base.py
# for exactly what a new type needs to implement, then add a new
# `searches:` entry here with `product_type: <your new type name>`.
# The general marketplaces below (eBay, Swappa, Mercari, OfferUp,
# BackMarket) will search that new category for free, since they
# build queries from product_name alone — no per-site config needed.
# Apple-only storefronts (Apple Refurb, BestBuy, Newegg, Gazelle) are
# marked `applicable_product_types: [electronics]` below so they're
# automatically skipped for a non-electronics search instead of
# wasting a request. A brand-new category's OWN dedicated retailers
# (e.g. Zappos for boots) still need their own scraper written from
# scratch, the same way src/scrapers/backmarket.py was.

searches:
  # ── MacBook Pro (14" preferred, 16" fallback; last 3 Max chip
  # generations via mac_chip above) ────────────────────────────
  - product_name: "MacBook Pro"
    product_type: electronics
    generation_family: mac_chip
    screen_sizes: [14, 16]   # order = preference: 14" preferred, 16" fallback
    ram_gb_primary: 128
    ram_gb_fallback: 64
    storage_gb_min: 1024    # 1TB minimum; no max — 1/2/4/6/8TB all valid,
    storage_gb_max: ~        # bigger just scores a little higher (see price_analyzer.py)
    location: ~
    results_per_size: 30

  # ── iPhone Pro Max (1TB+; last 3 generations via iphone_pro_max
  # above — currently 17/16/15 Pro Max) ─────────────────────────
  - product_name: "iPhone Pro Max"
    product_type: electronics
    generation_family: iphone_pro_max
    screen_sizes: []
    ram_gb_primary: ~
    ram_gb_fallback: ~
    storage_gb_min: 1000  # 1TB minimum (also covers 2TB)
    storage_gb_max: ~
    location: ~
    results_per_size: 30

# ── PRICE THRESHOLDS ───────────────────────────────────────────────
# These determine what counts as a "deal worth alerting about".
# The scraper will compare every listing against these numbers.
price:
  # Absolute maximum price we're willing to pay.
  # Anything above this is ignored entirely.
  absolute_max_usd: 8000

  # "Great deal" threshold — alert immediately if below this.
  # Based on research: 128GB models retail ~$6,200-9,700 new.
  # A great deal on 128GB would be under $5,000 (~25%+ off retail).
  # For 64GB, under $4,000.
  great_deal_usd:
    128: 5000    # 128GB: alert if under $5,000
    64:  4000    # 64GB:  alert if under $4,000

  # "Good deal" threshold — worth checking but less urgent.
  good_deal_usd:
    128: 5500    # 128GB: worth looking at under $5,500
    64:  4500    # 64GB:  worth looking at under $4,500

  # Number of top deals to include in each alert email
  # Increased from 15 to 25 to account for more scraping sources
  # (Best Buy, OfferUp, and future Facebook + Amazon).
  top_deals_count: 40

  # ── Suspicious-price safeguard ─────────────────────────────────
  # A listing priced way below the rest of its batch AND claiming to
  # be new/sealed is more likely mislabeled, a scam, or a typo than a
  # genuine steal. See src/price_analyzer.py's module docstring for
  # the full story (a real "New Sealed" iPhone found at $238 against
  # a ~$1,400 true price prompted this).
  # Flag a listing if its price is under this fraction of the batch
  # median AND it claims new/sealed condition.
  suspicious_price_ratio: 0.5
  # Only apply the check once a batch has at least this many listings
  # (so a tiny batch doesn't produce a meaningless "median").
  suspicious_min_sample: 3

# ── PRICE DROP ALERTS ───────────────────────────────────────────────
# A SEPARATE alert type from the "great/good deal" thresholds above.
# Those fire when a listing is first discovered; this fires when a
# listing we've ALREADY seen before drops in price on a later scrape
# (e.g. a seller cuts $300 off an existing eBay listing).
#
# Requires BOTH a minimum percent AND a minimum dollar drop before
# alerting, so a $5 price wiggle or a 1% rounding change never spams
# Discord — only look at drops that clear both bars.
price_drop:
  enabled: true
  min_drop_percent: 5   # must drop by at least 5%...
  min_drop_usd: 50      # ...AND at least $50, whichever is stricter in context

# ── WHAT SITES TO SCRAPE ───────────────────────────────────────────
# Set a site to "enabled: false" to skip it without deleting it.
# Each site has its own scraper module.
sites:
  ebay:
    enabled: true
    # eBay search URL template.  {{query}} is replaced with the
    # search term, {{min_ram}} with the minimum RAM.
    # We search for "MacBook Pro M5 Max 128GB" etc.
    search_url: "https://www.ebay.com/sch/i.html?_nkw={{query}}&_sop=15&LH_BIN=1&_udhi={{max_price}}"

  swappa:
    enabled: true
    # Swappa has a dedicated API for listings.
    base_url: "https://swappa.com/api"

  apple_refurb:
    enabled: true
    # Apple's own store only ever sells Apple electronics.
    applicable_product_types: [electronics]
    # NOTE: this search_url is not actually used — src/scrapers/
    # apple_refurb.py hits Apple's evergreen "14-inch-macbook-pro" /
    # "16-inch-macbook-pro" refurb pages directly (those URLs aren't
    # year- or chip-specific, so they never need updating). Kept here
    # only for reference.
    search_url: "https://www.apple.com/shop/refurbished/mac"

  backmarket:
    enabled: true
    search_url: "https://www.backmarket.com/search?q={{query}}"

  mercari:
    enabled: true
    search_url: "https://www.mercari.com/search/?keyword={{query}}"

  bestbuy:
    enabled: true
    # General electronics retailer, but its scraper/query only ever
    # targets Apple gear today.
    applicable_product_types: [electronics]
    # Best Buy Open Box — returned/inspected items at a discount.
    # The scraper uses the "af=condition%3Aopen+box" URL filter
    # and also validates condition text in each listing card.
    search_url: "https://www.bestbuy.com/site/searchpage.jsp?st={{query}}&af=condition%3Aopen+box"

  offerup:
    enabled: true
    # NOTE: OfferUp is fully JavaScript-rendered.  The scraper
    # tries JSON-LD, Next.js data, and the internal API.  If
    # none work, it logs instructions for Playwright setup.
    search_url: "https://offerup.com/search/?q={{query}}"

  newegg:
    enabled: true
    # Electronics retailer — never carries apparel or other
    # non-electronics categories.
    applicable_product_types: [electronics]
    # Newegg's third-party marketplace carries Refurbished/Used Apple
    # gear. No login required. The scraper uses a bare product-name
    # query (`d={{query}}`) with Newegg's default relevance sort —
    # see src/scrapers/newegg.py's module docstring for why appending
    # chip/screen-size terms or a price-ascending sort (both used by
    # other scrapers here) actively hurts result quality on Newegg.
    search_url: "https://www.newegg.com/p/pl?d={{query}}"

  gazelle:
    enabled: true
    # Used-electronics reseller only — phones/tablets/laptops, no
    # apparel or other categories.
    applicable_product_types: [electronics]
    # Gazelle's actual storefront lives on buy.gazelle.com (a Shopify
    # store) — www.gazelle.com 404s on collection/product/search
    # routes. The scraper hits buy.gazelle.com's public Shopify JSON
    # endpoints directly: /collections/{handle}/products.json for
    # known per-generation collections (e.g. iphone-17-pro-max), and
    # /search/suggest.json as a site-wide fallback. Gazelle does not
    # currently stock MacBooks (confirmed live — see gazelle.py's
    # module docstring), so the MacBook Pro search legitimately finds
    # 0 listings here today.
    search_url: "https://buy.gazelle.com/search/suggest.json?q={{query}}&resources[type]=product"

  craigslist:
    enabled: true
    # General local classifieds — applies to every product type
    # (like eBay/Swappa/Mercari/OfferUp/BackMarket), so
    # applicable_product_types is left unset.
    #
    # Craigslist is organized by CITY/METRO REGION, not by state —
    # each region has its own URL slug (e.g. "phoenix", "tucson"), and
    # a single state maps to several regions (e.g. California alone
    # has 20+). `regions` is a LIST so this scraper can "cast a wide
    # net" across multiple metros/states in one run — the scraper
    # loops over every entry here, aggregating results, with a polite
    # delay between each request (see BaseScraper.fetch_page). Cross-
    # source AND cross-region dedup is handled downstream in main.py
    # by source+listing_id, so listing the same metro twice or having
    # overlapping results across regions is harmless.
    #
    # Investigated Craigslist's "search nearby areas" feature first
    # (see scrapers/craigslist.py's module docstring LIVE-TESTING
    # FINDINGS) — it does not exist on the current consolidated
    # www.craigslist.org/search/area/{region} search host (no
    # searchNearby param, no nearby-areas UI element found live), so
    # enumerating region slugs below is the only way to cover multiple
    # states. Every slug below was verified live (2026-08-02) to
    # return HTTP 200 with real listings — prioritizing population
    # centers per state, not every rural sub-region.
    #
    # Covers: Arizona, New Mexico, California, Utah, Nevada, Colorado.
    regions:
      - "phoenix"        # AZ
      - "tucson"         # AZ
      - "albuquerque"    # NM
      - "santafe"        # NM
      - "losangeles"     # CA
      - "sfbay"          # CA
      - "sandiego"       # CA
      - "sacramento"     # CA
      - "saltlakecity"   # UT
      - "provo"          # UT
      - "lasvegas"       # NV
      - "reno"           # NV
      - "denver"         # CO
      - "cosprings"      # CO (verified slug — NOT "coloradosprings", which 404s)
      - "boulder"        # CO
    # NOTE: this search_url is not actually used programmatically —
    # src/scrapers/craigslist.py builds the real URL itself (it needs
    # to interpolate `region` and a server-side max_price filter, and
    # the actual live search host is the consolidated
    # www.craigslist.org/search/area/{region} form, not a per-city
    # subdomain — see that file's module docstring LIVE-TESTING
    # FINDINGS for exactly what was verified live). Kept here only as
    # a human-readable reference of the URL shape.
    search_url: "https://www.craigslist.org/search/area/{{region}}?cat=sss&query={{query}}&max_price={{max_price}}"

  # Facebook Marketplace requires a login — we handle this via
  # environment variables for the session cookie.
  facebook:
    enabled: false          # Disabled by default — requires login setup
    search_url: "https://www.facebook.com/marketplace/search/?query={{query}}"

# ── ALERT SETTINGS ─────────────────────────────────────────────────
# How you want to be notified when a deal is found.
alerts:
  # Email via Gmail SMTP (free).  Set these in GitHub Secrets:
  #   ALERT_EMAIL_FROM, ALERT_EMAIL_TO, GMAIL_APP_PASSWORD
  email:
    enabled: true
    smtp_server: "smtp.gmail.com"
    smtp_port: 587

  # Discord webhook (free).  Create a webhook in your Discord
  # server's channel settings, then set DISCORD_WEBHOOK_URL
  # in GitHub Secrets.
  discord:
    enabled: true

# ── RUN SCHEDULE ───────────────────────────────────────────────────
# How often to run the scraper.
# This is a cron expression.  "0 */6 * * *" = every 6 hours.
schedule:
  cron: "0 */6 * * *"

# ── DATABASE ───────────────────────────────────────────────────────
database:
  # SQLite is the default — no server needed, file-based.
  # Change to postgresql://user:pass@host/db if you want Postgres.
  url: "sqlite:///data/listings.db"
