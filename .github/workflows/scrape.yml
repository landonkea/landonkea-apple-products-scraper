# ───────────────────────────────────────────────────────────────────
# GitHub Actions workflow — runs the scraper every 6 hours
# ───────────────────────────────────────────────────────────────────
# This file tells GitHub to:
#   1. Run `apple-product-scraper` every 6 hours via cron
#   2. Allow manual triggering from the GitHub UI ("workflow_dispatch")
#   3. Commit the SQLite database back to the repo so we don't
#      lose seen listings between runs
#
# To enable:
#   1. Push this repo to GitHub (public or private)
#   2. Go to Settings → Secrets and variables → Actions
#   3. Add these secrets:
#      - ALERT_EMAIL_FROM: your Gmail address
#      - ALERT_EMAIL_TO: where alerts are sent
#      - GMAIL_APP_PASSWORD: your Gmail app password
#      - DISCORD_WEBHOOK_URL: your Discord webhook URL
#   4. Done! The scraper runs automatically.
# ───────────────────────────────────────────────────────────────────

name: Apple Product Scraper

# ── Prevent overlapping runs ───────────────────────────────────────
# If a scheduled run and a manual (workflow_dispatch) run ever
# overlap, both try to commit + push data/listings.db at the end,
# and whichever finishes second gets rejected by git (a race). This
# forces runs to queue instead of running in parallel, so there's
# only ever one "git push" happening at a time.
concurrency:
  group: apple-product-scraper
  cancel-in-progress: false

# ── When to run ──────────────────────────────────────────────────
on:
  # ── Cron trigger: fires every hour ───────────────────────────
  # GitHub Actions cron triggers are static -- they can't read a
  # runtime config file to decide their own schedule. So this fires
  # every hour, and the very first job step below decides -- by
  # reading config.yaml's `schedule:` section -- whether THIS hour
  # is one that should actually scrape. Every other hour exits in a
  # few seconds without installing anything. This is what makes the
  # schedule "dynamic": editing config.yaml's hour list changes real
  # behavior on the next firing, no edit to this file needed.
  schedule:
    - cron: "0 * * * *"

  # ── Manual trigger: allows running from GitHub UI ────────────
  # Always runs for real, regardless of the current hour or
  # config.yaml's schedule -- see the "Check if this hour should
  # run" step's condition.
  workflow_dispatch:

# ── Permissions ─────────────────────────────────────────────────
# Needed to commit the database file back to the repo
permissions:
  contents: write

# ── What to run ──────────────────────────────────────────────────
jobs:
  scrape:
    # Run on the latest Ubuntu (free tier)
    runs-on: ubuntu-latest
    
    # Timeout after 30 minutes (safety net)
    timeout-minutes: 30
    
    steps:
      # 1. Download the repo (including the database from last run)
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can commit changes
          fetch-depth: 0

      # 1b. This job's trigger fires every hour (see the `on:` block
      #     above). Before installing anything, check config.yaml's
      #     `schedule:` section to decide whether THIS hour is one
      #     that should actually scrape -- every other hour exits
      #     right here, in a few seconds, using no real minutes.
      #     Manual runs (workflow_dispatch) always proceed regardless
      #     of the hour -- see this step's `if:` below and each later
      #     step's `if:`.
      - name: Check if this hour should run
        id: schedule_check
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PYEOF'
          import ast
          import os
          import re
          from datetime import datetime, timezone

          with open("config.yaml") as f:
              text = f.read()

          def extract_hours(key: str) -> list[int]:
              match = re.search(rf"^\s*{key}:\s*(\[[^\]]*\])", text, re.MULTILINE)
              if not match:
                  raise ValueError(f"config.yaml's schedule: section is missing `{key}:` — "
                                    f"see README's 'Run Schedule' section for the expected format.")
              return ast.literal_eval(match.group(1))

          guaranteed = extract_hours("guaranteed_hours_utc")
          additional = extract_hours("additional_hours_utc")
          enabled_hours = set(guaranteed) | set(additional)

          current_hour = datetime.now(timezone.utc).hour
          should_run = current_hour in enabled_hours

          print(f"Current UTC hour: {current_hour}")
          print(f"Enabled hours (guaranteed + additional): {sorted(enabled_hours)}")
          print(f"Should run this hour: {should_run}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"should_run={'true' if should_run else 'false'}\n")
          PYEOF

      # 2. Set up Python
      - name: Setup Python
        if: github.event_name != 'schedule' || steps.schedule_check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"    # Caches pip downloads for faster runs

      # 3. Install dependencies
      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.schedule_check.outputs.should_run == 'true'
        run: |
          pip install -e .
          pip install -e ".[dev]"
          pip install playwright-stealth

      # 4. Install Playwright browsers (needed for OfferUp scraper)
      - name: Install Playwright browsers
        if: github.event_name != 'schedule' || steps.schedule_check.outputs.should_run == 'true'
        run: |
          playwright install --with-deps chromium

      # 4b. Run pytest/ruff/mypy and write a persisted, human-readable
      #     summary to test-results/latest.md (see
      #     scripts/run_tests_with_report.sh and the "Running Tests"
      #     section of the README). continue-on-error so a tooling
      #     failure here never blocks the scheduled scraper run below —
      #     this step's whole purpose is visibility, not gating.
      - name: Run tests and generate report
        if: github.event_name != 'schedule' || steps.schedule_check.outputs.should_run == 'true'
        continue-on-error: true
        run: |
          ./scripts/run_tests_with_report.sh

      - name: Upload test report
        if: always() && (github.event_name != 'schedule' || steps.schedule_check.outputs.should_run == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: test-results-production
          path: test-results/latest.md
          retention-days: 30

      # 4c. Write config.local.yaml from a GitHub Secret before the
      #     scraper runs — see config.local.yaml.example and
      #     load_config()'s docstring in src/config.py. This is how
      #     production searches the real Craigslist regions without
      #     that (personally identifying, though not a secret in the
      #     security sense) list ever being committed to this public
      #     repo. `|| true` on the secret check means a run with the
      #     secret unset just falls back to config.yaml's placeholder
      #     region — never a hard failure.
      - name: Write local config overrides
        if: github.event_name != 'schedule' || steps.schedule_check.outputs.should_run == 'true'
        env:
          CRAIGSLIST_REGIONS_YAML: ${{ secrets.CRAIGSLIST_REGIONS_YAML }}
        run: |
          if [ -n "$CRAIGSLIST_REGIONS_YAML" ]; then
            echo "$CRAIGSLIST_REGIONS_YAML" > config.local.yaml
          else
            echo "CRAIGSLIST_REGIONS_YAML secret not set — using config.yaml's placeholder region."
          fi

      # 5. Run the scraper
      - name: Run scraper
        if: github.event_name != 'schedule' || steps.schedule_check.outputs.should_run == 'true'
        env:
          # Explicitly declare that this is the real production run —
          # the only place that should ever post to the live Discord
          # channel and write to the real data/listings.db. Previously
          # this was an implicit default (ENVIRONMENT was unset); now
          # it's a visible, intentional declaration. See src/environment.py.
          ENVIRONMENT: production
          # Pass secrets as environment variables
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          mkdir -p data
          python -m main
      
      # 6. Commit the database + chart data back to the repo
      #    This preserves seen listings and price history between runs,
      #    and publishes the latest trend data to the GitHub Pages site.
      - name: Commit database and chart data updates
        if: github.event_name != 'schedule' || steps.schedule_check.outputs.should_run == 'true'
        run: |
          git config user.name "Apple Product Scraper Bot"
          git config user.email "bot@landonkea-apple-products-scraper"

          # Add the database file, the GitHub Pages data file, and the
          # watchlist (last_alerted_price/last_alerted_at bookkeeping
          # so a tracked listing's unchanged price doesn't re-alert
          # every run -- see src/watchlist.py). The `|| true` on `add`
          # already covers a missing watchlist.json (no watchlist
          # configured is the normal default state).
          git add data/listings.db docs/data/daily_stats.json data/watchlist.json 2>/dev/null || true

          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No database or chart-data changes to commit."
          else
            git commit -m "chore: update listings database + price trend data [skip ci]"
            git push
          fi

      # 7. Notify Discord if the run failed
      #    Without this, a failed run (bad scraper code, git push
      #    conflict, etc.) fails silently — the only sign is a red X
      #    on GitHub that nobody's watching. This posts straight to
      #    the same Discord channel as the deal alerts.
      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -X POST -H "Content-Type: application/json" \
              -d "{\"content\": \"⚠️ **Apple Products Scraper** run failed. [View logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" \
              "$DISCORD_WEBHOOK_URL"
          fi
